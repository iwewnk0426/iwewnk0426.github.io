content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: '{primary}.md'
    fields:
      - name: title
        type: string
        required: true
      - name: publishDate
        type: date
        required: true
      - name: description
        type: string
        required: true
      - name: body
        type: rich-text
